version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: prod_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_pg_password}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ../init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - prod_network

  redis:
    image: redis:7-alpine
    container_name: prod_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-your_redis_password}
    volumes:
      - redisdata_prod:/data
    networks:
      - prod_network

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: prod_api
    restart: always
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-your_pg_password}@db:5432/${POSTGRES_DB:-mydb}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-your_redis_password}@redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - prod_network

  celery:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: prod_celery_worker
    restart: always
    command: celery -A celery_app worker --loglevel=info -c 4
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-your_pg_password}@db:5432/${POSTGRES_DB:-mydb}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-your_redis_password}@redis:6379/0
    depends_on:
      - redis
      - db
    volumes:
      - video_tmp:/tmp
    networks:
      - prod_network

  beat:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: prod_celery_beat
    restart: always
    command: celery -A celery_app beat --loglevel=info
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-your_pg_password}@db:5432/${POSTGRES_DB:-mydb}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-your_redis_password}@redis:6379/0
    depends_on:
      - redis
      - db
    networks:
      - prod_network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prod_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - prod_network
    depends_on:
      - api
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: prod_alertmanager
    restart: always
    volumes:
      - ./alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - prod_network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: prod_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - prod_network
    depends_on:
      - prometheus

  nginx:
    image: nginx:1.25-alpine
    container_name: prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
    networks:
      - prod_network

  certbot:
    image: certbot/certbot:latest
    container_name: prod_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - prod_network

networks:
  prod_network:
    name: my_project_prod_net
    driver: bridge

volumes:
  pgdata_prod:
  redisdata_prod:
  video_tmp:
  prometheus_data:
  alertmanager_data:
  grafana_data:
