services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/mydb
      - REDIS_URL=${REDIS_URL}
    depends_on:
      - db
      - redis
      - celery
      - beat
  celery:
    build: .
    command: celery -A celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - db
    environment:
      - REDIS_URL=${REDIS_URL}
    volumes:
      - .:/app
  beat:
    build: .
    command: celery -A celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - db
    environment:
      - REDIS_URL=${REDIS_URL}
    volumes:
      - .:/app
volumes:
  pgdata:
